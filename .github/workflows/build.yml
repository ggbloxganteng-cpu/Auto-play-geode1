name: Auto Trajectory Build

on:
  workflow_dispatch:
  push:
    paths:
      - "input/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          test -f input/auto-trajectory.zip
          unzip -t input/auto-trajectory.zip

      - name: Extract source ZIP
        run: |
          mkdir extracted
          unzip -q input/auto-trajectory.zip -d extracted

          test -f extracted/auto-trajectory/CMakeLists.txt
          test -f extracted/auto-trajectory/mod.json

          rsync -a --exclude='.github/' \
            extracted/auto-trajectory/ ./

      - name: Run offline tests
        run: |
          chmod +x tests/run.sh
          bash tests/run.sh

      - name: Build Geode Android64
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - name: Package build
        uses: geode-sdk/build-geode-mod/combine@main
        id: package

      - name: Upload Geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auto-Trajectory-Android64
          path: ${{ steps.package.outputs.build-output }}
          if-no-files-found: error
